name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Checks (não bloqueante)
    runs-on: ubuntu-latest
    # O projeto está sendo integrado em partes. Falhas ficam visíveis no log,
    # mas não impedem o merge durante essa fase.
    continue-on-error: true
    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Testes unitários
        run: python -m pytest -q -m "not e2e"
        continue-on-error: true

      - name: Iniciar MongoDB e Redis
        run: docker compose up -d --wait
        continue-on-error: true

      - name: Testes end to end
        run: python -m pytest -q -m e2e
        continue-on-error: true

      - name: Encerrar serviços
        if: always()
        run: docker compose down
        continue-on-error: true
